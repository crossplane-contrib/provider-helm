apiVersion: helm.m.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: helm-provider
  namespace: crossplane-system
spec:
  credentials:
    source: Secret
    secretRef:
      name: coreweave
      namespace: upbound-system
      key: kubeconfig
  identity:
    type: CoreWeaveAPIToken
    source: Secret
    secretRef:
      name: coreweave-credentials
      namespace: upbound-system
      key: token